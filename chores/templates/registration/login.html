{% extends "chores/base.html" %}

{% block title %}Log in · ChoreBot{% endblock %}

{% block content %}
  <form method="post" class="login">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="done-btn">Log in</button>
  </form>
{% endblock %}
