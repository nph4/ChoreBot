<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ChoreBot{% endblock %}</title>
  <script>
    // Apply the saved theme before first paint; dark is the default.
    try { if (localStorage.getItem('theme') === 'light') document.documentElement.dataset.theme = 'light'; } catch (e) {}
  </script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js"></script>
  <style>
    /* Nord palette: https://www.nordtheme.com/docs/colors-and-palettes */
    :root[data-theme="dark"] {
      --bg: #2e3440; --card: #3b4252; --line: #4c566a; --fg: #eceff4; --muted: #d8dee9;
      --accent: #88c0d0; --on-accent: #2e3440; --late: #bf616a; --notice: #434c5e;
      color-scheme: dark;
    }
    :root[data-theme="light"] {
      --bg: #eceff4; --card: #ffffff; --line: #d8dee9; --fg: #2e3440; --muted: #4c566a;
      --accent: #5e81ac; --on-accent: #eceff4; --late: #bf616a; --notice: #e5e9f0;
      color-scheme: light;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.45 system-ui, sans-serif; }
    header, main { max-width: 44rem; margin: 0 auto; padding: 1rem; }
    header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: .5rem 1rem; }
    header h1 { font-size: 1.25rem; margin: 0; }
    header nav { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; }
    header form { display: inline; }
    a { color: var(--accent); }
    button { font: inherit; cursor: pointer; }
    .link-button { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; }
    h2 { font-size: 1rem; margin: 1.5rem 0 .5rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    h2.late { color: var(--late); }
    ul.chores { list-style: none; margin: 0; padding: 0; }
    .chore { display: flex; gap: 1rem; align-items: flex-start; justify-content: space-between; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; margin-bottom: .5rem; }
    .chore .title { font-weight: 600; }
    .meta, .chore .done-when, .empty, .helptext { color: var(--muted); font-size: .9rem; }
    .done-btn { flex-shrink: 0; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 6px; padding: .4rem .9rem; font-weight: 600; }
    .assign { margin-top: .35rem; font-size: .9rem; }
    .assign summary { color: var(--accent); cursor: pointer; width: fit-content; }
    .assign form { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; margin-top: .35rem; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    .notice { background: var(--notice); border: 1px solid var(--line); border-radius: 8px; padding: .75rem 1rem; }
    .filter a { margin-left: .5rem; }
    .filter a.current { color: var(--fg); text-decoration: none; font-weight: 600; }
    form.login p { display: flex; flex-direction: column; gap: .25rem; }
    input, select { font: inherit; color: var(--fg); background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: .35rem; }
    input[type="radio"] { padding: 0; }
    .errorlist { color: var(--late); margin: .25rem 0; padding-left: 1.25rem; }
    {% block extra_style %}{% endblock %}
  </style>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header>
    <h1><a href="{% url 'chores:dashboard' %}">ChoreBot</a></h1>
    <nav>
      {% if user.is_authenticated %}
        <a href="{% url 'chores:pickup_setup' %}">Pickup schedule</a>
      {% endif %}
      <button type="button" class="link-button" id="theme-toggle">Light mode</button>
      {% if user.is_authenticated %}
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <span class="meta">{{ user.get_username }}</span>
          <button type="submit" class="link-button">Log out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <script>
    (function () {
      var root = document.documentElement, button = document.getElementById('theme-toggle');
      function label() { button.textContent = root.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; }
      button.addEventListener('click', function () {
        root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
        try { localStorage.setItem('theme', root.dataset.theme); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</body>
</html>
