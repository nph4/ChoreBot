<div class="schedule-fields">
  {{ form.non_field_errors }}
  {% for field in form %}
    <div class="field field-{{ field.name }}">
      <label{% if field.name != "frequency" and field.name != "pickup_time" %} for="{{ field.id_for_label }}"{% endif %}>{{ field.label }}</label>
      {{ field.errors }}
      {{ field }}
      {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
    </div>
  {% endfor %}
</div>
